name: V3 CI

on:
  push:
    branches:
      - main
      - master
      - v3
    paths:
      - "v3/**"
      - "!v3/**.md"
      - "!v3/docs/**"
      - "!v3/LICENSE*"
  pull_request:
    branches:
      - main
      - master
      - v3
      - "release-*"
      - "stable/**"
    paths:
      - "v3/**"
      - "!v3/**.md"
      - "!v3/docs/**"
      - "!v3/LICENSE*"
  schedule:
    # Daily v3 sanity check at 03:00 UTC
    - cron: "0 03 * * *"
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  # The v3 tree ships standalone Go modules (nydusify, tests/integration) that
  # must not be pulled into the top-level nydus-rs go.work workspace.
  GOWORK: off

defaults:
  run:
    working-directory: v3

jobs:
  check:
    name: Cargo check
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Run cargo check
        run: |
          cargo check --all --all-targets

  lint:
    name: Golang lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Golangci lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7
          working-directory: v3/tests/integration

  test:
    name: Run tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

  integration-tests:
    name: Run integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Start local registry
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://localhost:5000/v2/; do sleep 1; done'

      - name: Run e2e tests
        run: |
          make test-e2e

      - name: Run xfstests
        run: |
          make test-xfstests
