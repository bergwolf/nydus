name: V3 Lint

on:
  push:
    branches:
      - main
      - master
      - v3
    paths:
      - "v3/**"
      - "!v3/**.md"
      - "!v3/docs/**"
      - "!v3/LICENSE*"
  pull_request:
    branches:
      - main
      - master
      - v3
      - "release-*"
      - "stable/**"
    paths:
      - "v3/**"
      - "!v3/**.md"
      - "!v3/docs/**"
      - "!v3/LICENSE*"
  workflow_dispatch:

env:
  # The v3 tree is a standalone Go module and must not be pulled into the
  # top-level nydus-rs go.work workspace.
  GOWORK: off

defaults:
  run:
    working-directory: v3

jobs:
  lint:
    name: V3 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          toolchain: 1.88.0

      - name: Run cargo fmt
        run: |
          cargo fmt --all -- --check

      - name: Run cargo clippy
        run: |
          cargo clippy --all --all-targets -- -D warnings
