name: V3 CI

on:
  push:
    branches: [master, main, release-*]
    paths:
      - "v3/**"
      - ".github/workflows/v3-ci.yml"
  pull_request:
    branches: [master, main, release-*]
    paths:
      - "v3/**"
      - ".github/workflows/v3-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: v3

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ---------- Lint jobs (from v3 lint.yml) ----------

  v3-rustfmt:
    name: V3 Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          toolchain: 1.88.0

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  v3-clippy:
    name: V3 Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          toolchain: 1.88.0

      - name: Run cargo clippy
        run: cargo clippy --all --all-targets --all-features -- -D warnings

  v3-golangci-lint:
    name: V3 Golangci lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [nydusify, tests/e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Golangci lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7
          working-directory: v3/${{ matrix.module }}

  # ---------- Build / test jobs (from v3 ci.yml) ----------

  v3-check:
    name: V3 Cargo check
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Run cargo check
        run: cargo check --all --all-targets --all-features

  v3-test:
    name: V3 Run tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

  v3-fuse-e2e-tests:
    name: V3 Run FUSE e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Start local registry
        working-directory: .
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://localhost:5000/v2/; do sleep 1; done'

      - name: Install filesystem test dependencies
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl attr erofs-utils fuse3 xfsprogs

      - name: Run e2e tests
        run: make test-e2e

      - name: Run the nydus-to-OCI round trip
        run: make test-tooci

      - name: Run read-only conformance tests
        run: make test-fs

  v3-nbd-tests:
    name: V3 Run NBD tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Load nbd and erofs kernel modules
        working-directory: .
        run: |
          sudo modprobe nbd || true
          sudo modprobe erofs || true

      - name: Run NBD E2E tests
        run: make test-nbd

  v3-ublk-tests:
    name: V3 Run ublk tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Load ublk_drv and erofs kernel modules
        working-directory: .
        run: |
          sudo modprobe ublk_drv || true
          sudo modprobe erofs || true

      - name: Run ublk tests
        run: make test-ublk

  v3-bench-tests:
    name: V3 Run bench tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Install fio
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y fio

      - name: Install erofsfuse (for the optional erofsfuse column)
        run: sudo bash tests/scripts/setup_erofsfuse.sh

      - name: Load nbd, ublk_drv and erofs kernel modules
        working-directory: .
        run: |
          sudo modprobe nbd || true
          sudo modprobe ublk_drv || true
          sudo modprobe erofs || true

      - name: Run bench tests
        run: make test-bench

  v3-uffd-tests:
    name: V3 Run UFFD tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Load erofs kernel module and install erofs-utils
        working-directory: .
        run: |
          sudo modprobe erofs || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq erofs-utils

      - name: Run UFFD tests
        run: |
          make test-uffd \
            UFFD_REQUIRE=1 \
            UFFD_EVIDENCE_DIR="${{ github.workspace }}/v3/uffd-evidence"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v3-uffd-evidence
          path: v3/uffd-evidence/
          if-no-files-found: ignore

  v3-fanotify-tests:
    name: V3 Run fanotify tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Load erofs kernel module
        working-directory: .
        run: sudo modprobe erofs || true

      - name: Start local registry
        working-directory: .
        run: |
          docker run -d --name registry -p 5000:5000 registry:2
          timeout 30 bash -c 'until curl -sf http://localhost:5000/v2/; do sleep 1; done'

      - name: Run fanotify E2E tests
        run: make test-fanotify
