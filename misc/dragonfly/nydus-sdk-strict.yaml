backend:
  type: registry
  config:
    # Intentionally unroutable origin endpoint: this mode is used to assert
    # behavior when Dragonfly is unavailable and origin fallback cannot succeed.
    addr: http://127.0.0.1:9
    repository: dragonflyoss/image-service/nginx
    http:
      timeout: 5s
      max_retries: 0
      tls:
        skip_verify: true
    dragonfly:
      scheduler_endpoint: http://127.0.0.1:8002
      ondemand_max_retries: 1
      prefetch_max_retries: 1
      fallback_interval: 0s
storage:
  dir: /tmp/nydus-dragonfly/cache-strict
prefetch:
  scope: none
